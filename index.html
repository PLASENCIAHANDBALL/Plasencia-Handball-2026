<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: la app usa toda la pantalla en móviles con notch / barra inferior -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Plasencia Handball · Torneo Internacional de Balonmano</title>
  <meta name="description" content="Partidos, resultados en directo, clasificaciones y pabellones del Torneo Internacional Plasencia Handball." />

  <meta name="theme-color" content="#5bb8f0" />
  <meta name="color-scheme" content="light" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Plasencia Handball" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Abrir antes las conexiones que se van a usar sí o sí -->
  <link rel="preconnect" href="https://manobzroedsaxagugcvn.supabase.co" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- El logo del splash es lo primero que se ve -->
  <link rel="preload" as="image" href="img/logo-torneo.webp" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div id="splash">

    <!-- LOGO (centrado) -->
    <img src="img/logo-torneo.webp" alt="Plasencia Handball" width="400" height="274" fetchpriority="high" />

    <!-- TEXTO + BARRA (abajo) -->
    <div class="splash-content">
      <div class="splash-texto">Cargando…</div>

      <div class="splash-barra">
        <div id="splash-progreso"></div>
      </div>
    </div>

  </div>

  <!-- HEADER + NAV -->
  <div class="header-wrapper">
    <header class="app-header">
      <h1 class="sr-only">Plasencia Handball · Torneo Internacional de Balonmano</h1>
    </header>

    <nav class="nav-principal" aria-label="Secciones de la app">
      <button type="button" data-view="inicio" onclick="mostrarHome()">🤾🏻‍♂️<span>Inicio</span></button>
      <button type="button" data-view="partidos" onclick="mostrarPartidos()">🥅<span>Partidos</span></button>
      <button type="button" data-view="categorias" onclick="mostrarCategorias()">📋<span>Categorías</span></button>
      <button type="button" data-view="clubs" onclick="mostrarEquipos()">🤝🏼<span>Clubs</span></button>
      <button type="button" data-view="tabla" onclick="mostrarClasificacion()">🏆<span>Tabla</span></button>
      <button type="button" data-view="pabellones" onclick="mostrarPabellones()">🏘️<span>Pabellones</span></button>
    </nav>
  </div>

  <main id="main">
    <section id="contenido">
      <noscript>Esta aplicación necesita JavaScript para mostrar los partidos y las clasificaciones.</noscript>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-email">
      ✉️ <a href="mailto:extremactive.deporte@gmail.com">extremactive.deporte@gmail.com</a>
    </div>

    <div class="footer-copy">
      © <span id="anio-footer">2026</span> · Torneo Internacional Plasencia Handball
    </div>
  </footer>

  <!-- BOTÓN REDES SOCIALES -->
  <div class="social-fab">
    <button type="button" class="social-main" onclick="toggleSocial()"
            aria-label="Redes sociales" aria-expanded="false" aria-controls="menu-social">
      <img src="img/redes.webp" alt="" width="34" height="34" />
    </button>

    <div class="social-menu" id="menu-social">
      <a href="https://instagram.com/plasenciahandball" target="_blank" rel="noopener noreferrer" class="social-btn">
        <img src="img/instagram.webp" alt="" width="22" height="22" loading="lazy" />
        <span>Instagram</span>
      </a>

      <a href="https://www.facebook.com/plasenciahandball/?locale=es_ES" target="_blank" rel="noopener noreferrer" class="social-btn">
        <img src="img/facebook.webp" alt="" width="22" height="22" loading="lazy" />
        <span>Facebook</span>
      </a>

      <a href="https://swltv.es/prohandballplasencia/" target="_blank" rel="noopener noreferrer" class="social-btn">
        <img src="img/twitch.webp" alt="" width="22" height="22" loading="lazy" />
        <span>Twitch</span>
      </a>
    </div>
  </div>

  <!-- BOTÓN ADMIN -->
  <button type="button" id="admin-fab" onclick="toggleAdmin()"
          aria-label="Acceso de organización" title="Acceso de organización">🔒</button>

  <!-- AVISOS (sustituyen a los alert() del navegador) -->
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <!-- APP -->
  <script type="module" src="js/app.js"></script>

  <!-- SOCIAL TOGGLE + AÑO DEL PIE -->
  <script>
    function toggleSocial(forzarCerrar) {
      var fab = document.querySelector('.social-fab');
      if (!fab) return;
      var abierto = forzarCerrar === true ? false : !fab.classList.contains('open');
      fab.classList.toggle('open', abierto);
      var boton = fab.querySelector('.social-main');
      if (boton) boton.setAttribute('aria-expanded', abierto ? 'true' : 'false');
    }

    // cerrar el menú al tocar fuera o pulsar Escape
    document.addEventListener('click', function (e) {
      var fab = document.querySelector('.social-fab');
      if (fab && fab.classList.contains('open') && !fab.contains(e.target)) toggleSocial(true);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') toggleSocial(true);
    });

    var anio = document.getElementById('anio-footer');
    if (anio) anio.textContent = new Date().getFullYear();
  </script>

</body>
</html>
