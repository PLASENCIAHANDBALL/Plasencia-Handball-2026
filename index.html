<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: la app usa toda la pantalla en móviles con notch / barra inferior -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Plasencia Handball · Torneo Internacional de Balonmano</title>
  <meta name="description" content="Partidos, resultados en directo, clasificaciones y pabellones del Torneo Internacional Plasencia Handball." />

  <meta name="theme-color" content="#5bb8f0" />
  <meta name="color-scheme" content="light" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Plasencia Handball" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Abrir antes las conexiones que se van a usar sí o sí -->
  <link rel="preconnect" href="https://manobzroedsaxagugcvn.supabase.co" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- El logo del splash es lo primero que se ve -->
  <link rel="preload" as="image" href="img/logo-torneo.webp" />
  <link rel="preload" as="image" href="img/splash-poster.webp" />

  <!-- Manrope: la tipografía de la app (si no carga, se usa la del sistema) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div id="splash">

    <!-- VÍDEO DE FONDO (silenciado; si no se puede reproducir se ve el póster) + velo azul claro -->
    <video class="splash-video" src="video/splash.mp4" poster="img/splash-poster.webp"
           autoplay muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
    <div class="splash-velo"></div>

    <!-- LOGO (centrado) -->
    <img src="img/logo-torneo.webp" alt="Plasencia Handball" width="400" height="274" fetchpriority="high" />

    <!-- TEXTO + BARRA (abajo) -->
    <div class="splash-content">
      <div class="splash-texto">Cargando…</div>

      <div class="splash-barra">
        <div id="splash-progreso"></div>
      </div>
    </div>

  </div>

  <!-- HEADER + NAV -->
  <div class="header-wrapper">
    <header class="app-header">
      <h1 class="sr-only">Plasencia Handball · Torneo Internacional de Balonmano</h1>
    </header>

    <button type="button" class="avisos-fab" id="avisos-fab" onclick="mostrarAvisos()" aria-label="Avisos de partidos"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 004 0"/></svg></button>

    <div class="idioma-fab" id="idioma-fab" translate="no">
      <button type="button" id="idioma-boton" class="idioma-boton" aria-haspopup="menu" aria-expanded="false" aria-label="Idioma"><span class="idioma-bandera" aria-hidden="true"></span></button>
      <div id="idioma-menu" class="idioma-menu" role="menu" aria-label="Idioma"></div>
    </div>

    <nav class="nav-principal" aria-label="Secciones de la app">
      <button type="button" data-view="inicio" onclick="mostrarHome()"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg><span>Inicio</span></button>
      <button type="button" data-view="partidos" onclick="mostrarPartidos()"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Partidos</span></button>
      <button type="button" data-view="categorias" onclick="mostrarCategorias()"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Categorías</span></button>
      <button type="button" data-view="clubs" onclick="mostrarEquipos()"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg><span>Clubs</span></button>
      <button type="button" data-view="tabla" onclick="mostrarClasificacion()"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Tabla</span></button>
      <button type="button" data-view="pabellones" onclick="mostrarPabellones()"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Pabellones</span></button>
      <button type="button" data-view="zona" onclick="mostrarZona()"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg><span>Zona Fan</span></button>
    </nav>
  </div>

  <main id="main">
    <section id="contenido">
      <noscript>Esta aplicación necesita JavaScript para mostrar los partidos y las clasificaciones.</noscript>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-email">
      <a href="mailto:extremactive.deporte@gmail.com">extremactive.deporte@gmail.com</a>
    </div>

    <div class="footer-copy">
      © 2027 · Torneo Internacional Plasencia Handball
    </div>
  </footer>

  <!-- BOTÓN "+" : reúne la canción, las redes sociales y el acceso de organización -->
  <div class="hub" id="hub">
    <button type="button" class="hub-main" id="hub-main" onclick="toggleHub()"
            aria-label="Más opciones" aria-expanded="false" aria-controls="hub-items">
      <svg class="ico" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="hub-items" id="hub-items">
  <!-- REPRODUCTOR DE LA CANCIÓN (botón flotante a la izquierda) -->
  <div class="music-fab" id="music-fab">
    <button type="button" class="music-main" onclick="toggleReproductor()"
            aria-label="Canción del torneo" aria-expanded="false" aria-controls="panel-musica">
      <svg class="ico ico-nota" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
      <span class="ecualizador" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>

    <div class="music-panel" id="panel-musica" role="group" aria-label="Reproductor de la canción del torneo">
      <div class="music-cabecera">
        <span class="reproductor-etiqueta">Suena en Plasencia</span>
        <strong class="reproductor-titulo">Canción del torneo</strong>
      </div>

      <input type="range" id="barra-cancion" value="0" min="0" max="100" step="0.1" style="--p:0%"
             aria-label="Posición de la canción" oninput="moverBarraCancion()">

      <div class="reproductor-pie">
        <span id="tiempo-actual">0:00</span>
        <div class="controles-cancion">
          <button type="button" onclick="reiniciarCancion()" class="btn-control" aria-label="Volver al principio de la canción">
            <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M19 5.5v13L9 12z"/></svg>
          </button>
          <button type="button" onclick="toggleCancionTorneo()" id="btn-play" class="btn-control btn-play" aria-label="Reproducir canción">
            <svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          </button>
        </div>
        <span id="tiempo-total">--:--</span>
      </div>
    </div>
  </div>

  <!-- BOTÓN REDES SOCIALES -->
  <div class="social-fab">
    <button type="button" class="social-main" onclick="toggleSocial()"
            aria-label="Redes sociales" aria-expanded="false" aria-controls="menu-social">
      <img src="img/redes.webp" alt="" width="34" height="34" />
    </button>

    <div class="social-menu" id="menu-social">
      <a href="https://instagram.com/plasenciahandball" target="_blank" rel="noopener noreferrer" class="social-btn">
        <img src="img/instagram.webp" alt="" width="22" height="22" loading="lazy" />
        <span>Instagram</span>
      </a>

      <a href="https://www.facebook.com/plasenciahandball/?locale=es_ES" target="_blank" rel="noopener noreferrer" class="social-btn">
        <img src="img/facebook.webp" alt="" width="22" height="22" loading="lazy" />
        <span>Facebook</span>
      </a>

      <a href="https://swltv.es/prohandballplasencia/" target="_blank" rel="noopener noreferrer" class="social-btn">
        <img src="img/twitch.webp" alt="" width="22" height="22" loading="lazy" />
        <span>Twitch</span>
      </a>
    </div>
  </div>

  <!-- BOTÓN ADMIN -->
  <button type="button" id="admin-fab" onclick="toggleAdmin()"
          aria-label="Acceso de organización" title="Acceso de organización"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
    </div>
  </div>

  <!-- AVISOS (sustituyen a los alert() del navegador) -->
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <!-- APP -->
  <script type="module" src="js/app.js"></script>

  <!-- SOCIAL TOGGLE + AÑO DEL PIE -->
  <script>
    function toggleSocial(forzarCerrar) {
      var fab = document.querySelector('.social-fab');
      if (!fab) return;
      var abierto = forzarCerrar === true ? false : !fab.classList.contains('open');
      fab.classList.toggle('open', abierto);
      var boton = fab.querySelector('.social-main');
      if (boton) boton.setAttribute('aria-expanded', abierto ? 'true' : 'false');
    }

    // cerrar el menú al tocar fuera o pulsar Escape
    document.addEventListener('click', function (e) {
      var fab = document.querySelector('.social-fab');
      if (fab && fab.classList.contains('open') && !fab.contains(e.target)) toggleSocial(true);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') toggleSocial(true);
    });

    // BOTÓN "+": abre y cierra el abanico con la canción, las redes y el acceso de organización
    function toggleHub(forzarCerrar) {
      var hub = document.getElementById('hub');
      if (!hub) return;
      var abrir = forzarCerrar === true ? false : !hub.classList.contains('open');
      hub.classList.toggle('open', abrir);
      var boton = document.getElementById('hub-main');
      if (boton) {
        boton.setAttribute('aria-expanded', abrir ? 'true' : 'false');
        boton.setAttribute('aria-label', abrir ? 'Cerrar menú' : 'Más opciones');
      }
      if (!abrir) {
        if (window.toggleReproductor) window.toggleReproductor(true);
        toggleSocial(true);
      }
    }
    document.addEventListener('click', function (e) {
      var hub = document.getElementById('hub');
      if (hub && hub.classList.contains('open') && !hub.contains(e.target)) toggleHub(true);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') toggleHub(true);
    });
    // al abrir el acceso de organización el menú se recoge
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('#admin-fab')) setTimeout(function () { toggleHub(true); }, 150);
    });
  </script>

</body>
</html>
